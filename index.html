<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050706">
<meta name="description" content="Celular no boleto, mesmo com nome sujo. Faça sua análise na InfoTech Informática.">
<title>InfoTech Celular no Boleto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: cartão único e compacto sobre o fundo de trilhas de circuito do site da InfoTech */
:root{
  --ink:#050706; --ink-2:#0B100D; --ink-3:#131A16; --line:#1C2520;
  --white:#ffffff; --muted:#A9B4AE;
  --g1:#3DFF9A; --g2:#00C96F; --g3:#009F57;
  --grad:linear-gradient(115deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%);
  --error:#ff7a7a;
  --f-display:"Archivo",system-ui,sans-serif;
  --f-tech:"Chakra Petch","Archivo",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--white);font-family:var(--f-display);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}

/* trilhas de circuito, igual ao site */
.circuit{position:fixed;inset:0;z-index:-2;pointer-events:none;background:rgba(255,255,255,.06);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><path d='M0 36h52l20 20h64l12-12h92'/><path d='M36 240v-58l24-24V96'/><path d='M150 0v30l22 22v70l-22 22v96'/><path d='M240 128h-34l-18 18h-70'/><path d='M0 196h70l18-18h20'/><path d='M96 0v18'/><path d='M206 240v-40l18-18h16'/><path d='M0 112h20l12 12v28'/><circle cx='60' cy='92' r='5'/><circle cx='118' cy='146' r='5'/><circle cx='108' cy='178' r='4'/><circle cx='96' cy='22' r='4'/><circle cx='32' cy='156' r='4'/><circle cx='224' cy='182' r='4'/><rect x='184' y='70' width='26' height='26' rx='4'/></svg>") repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><path d='M0 36h52l20 20h64l12-12h92'/><path d='M36 240v-58l24-24V96'/><path d='M150 0v30l22 22v70l-22 22v96'/><path d='M240 128h-34l-18 18h-70'/><path d='M0 196h70l18-18h20'/><path d='M96 0v18'/><path d='M206 240v-40l18-18h16'/><path d='M0 112h20l12 12v28'/><circle cx='60' cy='92' r='5'/><circle cx='118' cy='146' r='5'/><circle cx='108' cy='178' r='4'/><circle cx='96' cy='22' r='4'/><circle cx='32' cy='156' r='4'/><circle cx='224' cy='182' r='4'/><rect x='184' y='70' width='26' height='26' rx='4'/></svg>") repeat}
.glow{position:fixed;z-index:-1;width:560px;height:560px;max-width:150vw;left:50%;top:-220px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(0,201,111,.28),rgba(0,201,111,0) 65%);pointer-events:none}

.wrap{max-width:420px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 32px;display:flex;flex-direction:column;align-items:center;gap:20px}

.logo{display:block;width:100%;max-width:230px;height:auto}

.offer{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.offer h1{margin:0;font-family:var(--f-display);font-stretch:118%;font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.02em;filter:drop-shadow(0 4px 14px rgba(0,0,0,.85))}
.offer .l1{display:block;font-size:clamp(62px,19vw,86px)}
.offer .l2{display:block;font-size:clamp(48px,14.6vw,66px);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin:2px 0 0;display:inline-block;font-family:var(--f-tech);font-weight:700;font-size:clamp(16px,5vw,24px);letter-spacing:.05em;white-space:nowrap;text-transform:uppercase;color:var(--ink);background:var(--grad);padding:10px 18px;border-radius:6px;box-shadow:0 0 0 2px rgba(61,255,154,.35),0 10px 30px -8px rgba(0,201,111,.9);transform:rotate(-2deg)}

.card{width:100%;background:rgba(11,16,13,.86);border:1px solid var(--line);border-radius:14px;padding:18px;backdrop-filter:blur(4px)}
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--f-tech);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;font:500 16px/1.2 var(--f-display);color:var(--white);background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-height:46px;outline:none;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#6f7c75}
.field input:focus-visible{border-color:var(--g2);box-shadow:0 0 0 3px rgba(0,201,111,.22)}
.field.bad input{border-color:var(--error)}
.err{margin:0;font-size:12.5px;color:var(--error)}
.err:empty{display:none}

.cta{margin-top:4px;width:100%;min-height:50px;border:0;border-radius:8px;cursor:pointer;
  font:700 17px/1 var(--f-tech);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--grad);
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px -10px rgba(0,201,111,.8);transition:filter .15s,transform .1s}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.cta svg{width:20px;height:20px;flex:none}
.fine{margin:2px 0 0;font-size:12px;color:var(--muted);text-align:center}

.done{padding:12px;border:1px solid var(--g2);border-radius:8px;background:rgba(0,201,111,.08);font-size:13.5px;display:flex;flex-direction:column;gap:8px;text-align:center}
.done a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:8px;background:var(--grad);color:var(--ink);font:700 14px/1 var(--f-tech);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function maskCPF(v){
  v = digits(v).slice(0,11);
  return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
}
function maskZap(v){
  v = digits(v).slice(0,11);
  if (v.length <= 2) return v.length ? "(" + v : v;
  if (v.length <= 6) return "(" + v.slice(0,2) + ") " + v.slice(2);
  if (v.length <= 10) return "(" + v.slice(0,2) + ") " + v.slice(2,6) + "-" + v.slice(6);
  return "(" + v.slice(0,2) + ") " + v.slice(2,3) + " " + v.slice(3,7) + "-" + v.slice(7);
}
function cpfValido(c){
  c = digits(c);
  if (c.length !== 11 || /^(\d)\1{10}$/.test(c)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += +c[i] * (10 - i);
  if ((s * 10) % 11 % 10 !== +c[9]) return false;
  s = 0;
  for (let i = 0; i < 10; i++) s += +c[i] * (11 - i);
  return (s * 10) % 11 % 10 === +c[10];
}

$("cpf").addEventListener("input", e => { e.target.value = maskCPF(e.target.value); });
$("zap").addEventListener("input", e => { e.target.value = maskZap(e.target.value); });

function setErr(key, msg){
  $("e-" + key).textContent = msg || "";
  $("f-" + key).classList.toggle("bad", !!msg);
}

$("lead").addEventListener("submit", e => {
  e.preventDefault();
  const nome = $("nome").value.trim();
  const cpf = $("cpf").value;
  const zap = $("zap").value;
  let ok = true;

  if (nome.split(/\s+/).filter(Boolean).length < 2) { setErr("nome", "Digite seu nome e sobrenome."); ok = false; } else setErr("nome");
  if (!cpfValido(cpf)) { setErr("cpf", "Confira o CPF: ele precisa ter 11 números válidos."); ok = false; } else setErr("cpf");
  const z = digits(zap);
  if (z.length < 10 || z.length > 11) { setErr("zap", "Digite o WhatsApp com DDD."); ok = false; } else setErr("zap");

  if (!ok) { const first = document.querySelector(".field.bad input"); if (first) first.focus(); return; }

  const msg =
    "Olá! Quero fazer a análise do *celular no boleto*.\n\n" +
    "*Nome:* " + nome + "\n" +
    "*CPF:* " + maskCPF(cpf) + "\n" +
    "*WhatsApp:* " + maskZap(zap);
  const url = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msg);

  const a = $("wa");
  a.href = url;
  $("done").hidden = false;
  a.click();
});
